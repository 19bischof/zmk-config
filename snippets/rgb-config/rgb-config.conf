### RGB UNDERGLOW
# Used only by build.yaml entries that set snippet: rgb-config.
# Solid colour, on at boot, brightness 0, so the driver continuously writes
# black and holds the strip dark. Leaving the driver out instead lets P0.06
# float and the LEDs latch noise. Raise BRT_START to light them up again.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# 0 Solid color    1 Breathe    2 Spectrum    3 Swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=2
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# Keep the OLED powered when underglow is toggled off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
