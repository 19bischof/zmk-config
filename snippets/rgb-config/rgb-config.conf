### RGB UNDERGLOW
# Used only by build.yaml entries that set snippet: rgb-config.
# Solid red at 20% brightness, on at boot. Brightness is kept low so the strip
# stays easy on the eyes and cannot sag the rail.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# 0 Solid color    1 Breathe    2 Spectrum    3 Swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=2
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# Keep the OLED powered when underglow is toggled off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
