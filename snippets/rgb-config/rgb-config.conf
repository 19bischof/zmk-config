### RGB UNDERGLOW
# Lit build. Used only by build.yaml entries that set snippet: rgb-config.
# For a build that keeps the strip dark, use snippet: rgb-off instead.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# 0 Solid color    1 Breathe    2 Spectrum    3 Swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=2
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# Switch the strip off once the keyboard goes idle. The threshold is
# CONFIG_ZMK_IDLE_TIMEOUT in config/corne.conf. Any keypress brings it back.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Keep the OLED powered when underglow is toggled off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
