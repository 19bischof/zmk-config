### RGB UNDERGLOW, DARK BUILD
# Dark build. Used only by build.yaml entries that set snippet: rgb-off.
# The driver is deliberately compiled in and left off, so it writes black to
# the strip and holds it there. Omitting CONFIG_WS2812_STRIP instead leaves
# P0.06 unconfigured, the data line floats, and the LEDs latch noise.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=2
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Keep the OLED powered when underglow is off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
